prompts:
  - |
    Tuliskan fungsi Python bernama `hitung_diskon_bertingkat(harga_total, jumlah_item)` untuk menghitung nilai diskon belanja di HIJILABStore dengan aturan:
    1. Jika `jumlah_item` lebih dari 5, dapat diskon 10% dari `harga_total`.
    2. Jika `jumlah_item` lebih dari 10, dapat diskon 15% dari `harga_total`.
    3. Batas maksimal nilai diskon yang bisa didapatkan adalah Rp15.000 (tidak boleh lebih).
    4. Jika syarat di atas tidak terpenuhi, nilai diskon adalah 0.

    Kembalikan hanya kode Python di dalam blok markdown ```python ... ``` tanpa teks penjelasan apapun agar bisa dieksekusi langsung.

