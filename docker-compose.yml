# Production Compose file for AxonRouter using pre-built GHCR images.
# For local building from Dockerfiles, use: docker compose -f docker-compose.build.yml up -d --build
services:
  # Standalone Hono API gateway — serves /v1/* on port 3778
  axonrouter-api:
    image: ghcr.io/rickicode/axonrouter-api:latest
    container_name: axonrouter-api
    restart: always
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "3778:3778"
      - "10129:3778"
    volumes:
      - axonrouter-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      GATEWAY_PORT: "${GATEWAY_PORT:-3778}"
      GATEWAY_CLUSTER: "${GATEWAY_CLUSTER:-true}"
      GATEWAY_WORKERS: "${GATEWAY_WORKERS:-4}"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Jakarta
      NODE_ENV: production
      MALLOC_ARENA_MAX: "2"
      DATABASE_URL: ${DATABASE_URL:-postgres://axonrouter:${POSTGRES_PASSWORD:-password123}@postgres:5432/axonrouter}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3778/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  # AxonRouter web dashboard + control plane (Vite SPA + Hono) — serves on port 3777
  axonrouter-web:
    image: ghcr.io/rickicode/axonrouter-web:latest
    container_name: axonrouter-web
    restart: always
    mem_limit: 2500m
    memswap_limit: 2500m
    ports:
      - "3777:3777"
      - "10128:3777"
    volumes:
      - axonrouter-data:/app/data
      - ${LOG_DIR:-/opt/axonrouter/logs}:/app/data/logs
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "3777"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Jakarta
      NODE_ENV: production
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      PROXY_DISPATCHERS_MAX_SIZE: "128"
      DATABASE_URL: ${DATABASE_URL:-postgres://axonrouter:${POSTGRES_PASSWORD:-password123}@postgres:5432/axonrouter}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      REQUEST_DETAILS_SHOW_RAW: ${REQUEST_DETAILS_SHOW_RAW:-false}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL 17 pure ACID database
  postgres:
    image: postgres:17-alpine
    container_name: axonrouter-postgres
    restart: always
    mem_limit: 1g
    memswap_limit: 1g
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "restart_after_crash=on"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axonrouter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-axonrouter}
      TZ: Asia/Jakarta
    volumes:
      - axonrouter-pgdata:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-axonrouter} -d $${POSTGRES_DB:-axonrouter}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auto-updater: monitors GHCR every 12 hours and restarts updated containers
  watchtower:
    image: containrrr/watchtower:latest
    container_name: axonrouter-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "43200" # 12 hours
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    command: axonrouter-api axonrouter-web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  axonrouter-data:
    name: ${DATA_VOLUME:-axonrouter-data}
    external: ${DATA_VOLUME_EXTERNAL:-false}
  axonrouter-pgdata:
    name: ${PGDATA_VOLUME:-axonrouter-pgdata}
