# Production Compose file for AxonRouter using pre-built GHCR images.
# For local building from Dockerfiles, use: docker compose -f docker-compose.build.yml up -d --build
#
# ── Database backend ──────────────────────────────────────────────────────────
# This base file contains NO database container — it is the correct stack for an
# EXTERNAL / managed PostgreSQL (Neon, Supabase, RDS, Aiven, existing server): set
# DATABASE_URL in .env and run `docker compose up -d` as-is.
#
# For the BUILT-IN Postgres container, enable the overlay via .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.postgres.yml
# (the one-line installer scripts/install.sh asks and configures this for you)
#
# Valkey is part of this file. `docker compose up -d` starts it and both app
# containers receive VALKEY_URL=redis://valkey:6379. Set VALKEY_URL in .env only
# when the shared cache is an external Redis/Valkey. The app still boots if the
# container is down and falls open to process memory.
services:
  # Standalone Hono API gateway — serves /v1/* on port 3778
  axonrouter-api:
    image: ghcr.io/rickicode/axonrouter-api:latest
    container_name: axonrouter-api
    restart: always
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "3778:3778"
    volumes:
      - axonrouter-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      GATEWAY_PORT: "${GATEWAY_PORT:-3778}"
      GATEWAY_CLUSTER: "${GATEWAY_CLUSTER:-true}"
      GATEWAY_WORKERS: "${GATEWAY_WORKERS:-4}"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Jakarta
      NODE_ENV: production
      MALLOC_ARENA_MAX: "2"
      DATABASE_URL: ${DATABASE_URL:-postgres://axonrouter:${POSTGRES_PASSWORD:-password123}@postgres:5432/axonrouter}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3778/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      valkey:
        condition: service_started
        required: false

  # AxonRouter web dashboard + control plane (Vite SPA + Hono) — serves on port 3777
  axonrouter-web:
    image: ghcr.io/rickicode/axonrouter-web:latest
    container_name: axonrouter-web
    restart: always
    mem_limit: 2500m
    memswap_limit: 2500m
    ports:
      - "3777:3777"
    volumes:
      - axonrouter-data:/app/data
      - ${LOG_DIR:-/opt/axonrouter/logs}:/app/data/logs
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "3777"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Jakarta
      NODE_ENV: production
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      PROXY_DISPATCHERS_MAX_SIZE: "128"
      DATABASE_URL: ${DATABASE_URL:-postgres://axonrouter:${POSTGRES_PASSWORD:-password123}@postgres:5432/axonrouter}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      REQUEST_DETAILS_SHOW_RAW: ${REQUEST_DETAILS_SHOW_RAW:-false}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      valkey:
        condition: service_started
        required: false

  # Auto-updater: monitors GHCR every 12 hours and restarts updated containers
  watchtower:
    image: containrrr/watchtower:latest
    container_name: axonrouter-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "43200" # 12 hours
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      DOCKER_API_VERSION: "${DOCKER_API_VERSION:-1.44}"
    command: axonrouter-api axonrouter-web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # Valkey 8. Realtime coordination only: no persistence, LRU eviction, and no
  # host port. Reachable solely by the sibling containers on the compose network.
  valkey:
    image: valkey/valkey:8-alpine
    container_name: axonrouter-valkey
    restart: always
    mem_limit: 256m
    memswap_limit: 256m
    command:
      - "valkey-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "192mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    environment:
      TZ: Asia/Jakarta
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  axonrouter-data:
    name: ${DATA_VOLUME:-axonrouter-data}
    external: ${DATA_VOLUME_EXTERNAL:-false}
