# Compose overlay — BUILT-IN Valkey speed layer for AxonRouter.
#
# Enable it by adding this line to .env (or exporting COMPOSE_FILE):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.valkey.yml
#
# The installer (scripts/install.sh) writes that line automatically when you
# choose the built-in Valkey. When you point VALKEY_URL at an EXTERNAL
# Redis/Valkey (ElastiCache, Upstash, managed Redis), leave COMPOSE_FILE
# without this overlay — it is simply never read, and no valkey container or
# volume is created at all.
#
# Why this overlay exists:
#   AxonRouter keeps active requests, the recent-request ring, account
#   cooldowns and rotation mutexes in a shared Valkey so every gateway worker
#   and the dashboard web server see the SAME realtime state. Without it each
#   process falls back to its own in-memory map: the dashboard only shows the
#   requests handled by its own worker, /api/usage/stream misses other
#   workers, and cooldown/rotation decisions are per-process instead of
#   global. The application fails open to memory when Valkey is absent, so
#   this is a behaviour upgrade, not a hard dependency.
#
# Combined use with the built-in database:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.postgres.yml:docker-compose.valkey.yml
#
# Use directly with:
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.valkey.yml up -d
services:
  axonrouter-api:
    environment:
      # Sibling-service DNS name. Overrides the 127.0.0.1 client default,
      # which inside a container points at the container's own loopback.
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
    depends_on:
      valkey:
        # Ordered, not mandatory: `required: false` keeps the app bootable when
        # Valkey is unhealthy, matching the fail-open-to-memory contract in
        # src/lib/cache/valkeyClient.js. ioredis keeps retrying in the
        # background, so the shared registry self-heals once Valkey returns.
        condition: service_started
        required: false

  axonrouter-web:
    environment:
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
    depends_on:
      valkey:
        condition: service_started
        required: false

  # Valkey 8 — BSD-licensed Redis fork. Realtime coordination only:
  #   * no AOF/RDB persistence; state is reconstructible from live traffic
  #   * noeviction is unsafe to leave default for a pure cache, so we cap
  #     memory and let LRU evict
  #   * no password on the compose network; the port is NOT published to the
  #     host, so it is reachable only by the two sibling containers
  valkey:
    image: valkey/valkey:8-alpine
    container_name: axonrouter-valkey
    restart: always
    mem_limit: 256m
    memswap_limit: 256m
    command:
      - "valkey-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "192mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    environment:
      TZ: Asia/Jakarta
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
