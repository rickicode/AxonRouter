name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify lockfile is npm-10-compatible
        run: node scripts/verify-lockfile-npm10.mjs

      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image names
        id: images
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "web=ghcr.io/${owner}/axonrouter-web" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/${owner}/axonrouter-api" >> "$GITHUB_OUTPUT"

      # --- Build & Push axonrouter-web ---
      - name: Extract metadata (axonrouter-web)
        id: meta-web
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ steps.images.outputs.web }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      - name: Build and push axonrouter-web
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.images.outputs.web }}:buildcache
          cache-to: type=registry,ref=${{ steps.images.outputs.web }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false

      # --- Build & Push axonrouter-api (Standalone Hono Gateway) ---
      - name: Extract metadata (axonrouter-api)
        id: meta-api
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ steps.images.outputs.api }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      - name: Build and push axonrouter-api
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ./Dockerfile.gateway
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.images.outputs.api }}:buildcache
          cache-to: type=registry,ref=${{ steps.images.outputs.api }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false
