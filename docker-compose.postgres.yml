# Compose overlay — BUILT-IN PostgreSQL container for AxonRouter.
#
# Enable it by adding this line to .env (or exporting COMPOSE_FILE):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.postgres.yml
#
# The installer (scripts/install.sh) writes that line automatically when you
# choose the built-in database. When you use an EXTERNAL managed Postgres,
# leave COMPOSE_FILE unset — this overlay is simply never read, and no
# postgres container or pgdata volume is created at all.
#
# Use with: docker compose --env-file .env -f docker-compose.yml -f docker-compose.postgres.yml up -d
# (compose reads COMPOSE_FILE from the environment automatically, so the plain
#  `docker compose up -d` also works once COMPOSE_FILE is in .env)
services:
  axonrouter-api:
    depends_on:
      postgres:
        condition: service_healthy

  axonrouter-web:
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL 17 pure ACID database (only present with this overlay)
  postgres:
    image: postgres:17-alpine
    container_name: axonrouter-postgres
    restart: always
    mem_limit: 1g
    memswap_limit: 1g
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "restart_after_crash=on"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axonrouter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-axonrouter}
      TZ: Asia/Jakarta
    volumes:
      - axonrouter-pgdata:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-axonrouter} -d $${POSTGRES_DB:-axonrouter}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  axonrouter-pgdata:
    name: ${PGDATA_VOLUME:-axonrouter-pgdata}
